name: Release

# 每次推送到 main → 自动把修订号 +1（v1.0.3 → v1.0.4 …）并发布一个发行版；
# 推送 v* 标签 → 按该标签发布；也可以手动触发并选择 patch / minor / major。
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      bump:
        description: '版本递增方式：patch / minor / major'
        required: false
        default: 'patch'

permissions:
  contents: write

env:
  # 仓库里还没有任何 v* 标签时的基准版本（文档里的 v1.0.0 ~ v1.0.2 是开发期内部版本）
  INITIAL_VERSION: 'v1.0.2'

jobs:
  # ---------------------------------------------------------------
  # 1) 先算出版本号（纯 git 操作，用便宜的 ubuntu runner）
  # ---------------------------------------------------------------
  version:
    name: 计算版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
    steps:
      - name: 检出源码（需要全部标签）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 计算本次要发布的版本
        id: calc
        shell: bash
        run: |
          set -euo pipefail

          # a) 推的是 tag：直接用这个 tag
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "→ 按标签发布：${{ github.ref_name }}"
            exit 0
          fi

          # b) 推的是分支：当前提交若已经有 v* 标签，就交给 tag 事件发，避免重复
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "当前提交已带 v* 标签，跳过自动发布（由 tag 事件负责）"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # c) 找最后一个 v* 标签，按 patch/minor/major 自增
          BUMP='${{ github.event.inputs.bump }}'
          if [ -z "$BUMP" ]; then BUMP=patch; fi

          LAST=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LAST" ]; then LAST='${{ env.INITIAL_VERSION }}'; fi

          base="${LAST#v}"
          IFS='.' read -r major minor patch <<< "$base"
          case "$BUMP" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            *)     patch=$((patch+1)) ;;
          esac

          VERSION="v$major.$minor.$patch"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "→ 上一个版本：$LAST；本次按 $BUMP 递增：$VERSION"

  # ---------------------------------------------------------------
  # 2) 构建 + 自检 + 发布（自检脚本按 Windows 开发，放 Windows runner）
  # ---------------------------------------------------------------
  release:
    name: 构建并发布发行版
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 构建 Agent jar
        run: mvn -B -ntp clean package

      - name: 自检 1/4 · 类加载器隔离（切面真的挂上了）
        shell: pwsh
        run: ./verify/loaderiso.ps1

      - name: 自检 2/4 · 外置账号聊天广播（逐接收者分流）
        shell: pwsh
        run: ./verify/chat.ps1

      - name: 自检 3/4 · 区块卡顿勘探 + 管理员命令（替身内联真实切面）
        shell: pwsh
        run: ./verify/lag.ps1

      - name: 自检 4/4 · Authlib 3/6/10 兼容与鉴权分流 + 热重载
        shell: pwsh
        run: ./verify/verify.ps1

      - name: 生成版本化的 jar 与产物信息
        id: meta
        shell: pwsh
        run: |
          $version = '${{ needs.version.outputs.version }}'
          $jar = 'target/HyAuth-Agent-1.0.0.jar'      # Maven 版本固定 1.0.0，发布版本由 tag 体现
          $hash = (Get-FileHash $jar -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $jar).Length
          Copy-Item $jar "target/HyAuth-Agent-$version.jar"

          "version=$version" >> $env:GITHUB_OUTPUT
          "sha256=$hash"     >> $env:GITHUB_OUTPUT
          "size=$size"       >> $env:GITHUB_OUTPUT
          "jar=target/HyAuth-Agent-$version.jar" >> $env:GITHUB_OUTPUT

          "`n$version（GitHub Actions 构建，run ${{ github.run_number }}）" | Add-Content -Path BUILD.txt
          "SHA256  $hash" | Add-Content -Path BUILD.txt

          "版本   : $version"
          "大小   : $size 字节"
          "SHA256 : $hash"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          body: |
            **下载**：
            - `HyAuth-Agent-1.0.0.jar` —— 与部署文档、`start.sh` / `start.bat` 里的文件名一致，**直接替换服务端目录里的旧 jar 即可**
            - `HyAuth-Agent-${{ steps.meta.outputs.version }}.jar` —— 同字节的归档副本（想按版本号留存时用这个）

            构建信息
            | 项目 | 值 |
            | --- | --- |
            | 版本 | `${{ steps.meta.outputs.version }}` |
            | 提交 | `${{ github.sha }}` |
            | 大小 | ${{ steps.meta.outputs.size }} 字节 |
            | SHA256 | `${{ steps.meta.outputs.sha256 }}` |
            | 自检 | `verify\loaderiso.ps1`、`verify\chat.ps1`、`verify\lag.ps1`、`verify\verify.ps1` 全部通过 |

            升级：替换 jar → 重启服务端（配置项不用改）。说明见仓库 README。
          files: |
            target/HyAuth-Agent-1.0.0.jar
            target/HyAuth-Agent-${{ steps.meta.outputs.version }}.jar
            BUILD.txt
          fail_on_unmatched_files: true
