name: Release

# 打 tag（v*）即自动构建发行版；也可以在 Actions 页面手动指定已有 tag 触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号（例如 v1.0.2；不存在会自动按当前提交创建）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 构建 Agent jar
        run: mvn -B -ntp clean package

      - name: 自检 1/3 · 类加载器隔离（切面真的挂上了）
        shell: pwsh
        run: ./verify/loaderiso.ps1

      - name: 自检 2/3 · 外置账号聊天广播（逐接收者分流）
        shell: pwsh
        run: ./verify/chat.ps1

      - name: 自检 3/3 · Authlib 3/6/10 兼容与鉴权分流 + 热重载
        shell: pwsh
        run: ./verify/verify.ps1

      - name: 计算产物信息并生成带版本号的副本
        id: meta
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          $jar = 'target/HyAuth-Agent-1.0.0.jar'
          $hash = (Get-FileHash $jar -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $jar).Length
          # 同一个 jar 再存一份带版本号的名字，方便归档/区分版本
          Copy-Item $jar "target/HyAuth-Agent-$tag.jar"
          "tag=$tag"          >> $env:GITHUB_OUTPUT
          "sha256=$hash"      >> $env:GITHUB_OUTPUT
          "size=$size"        >> $env:GITHUB_OUTPUT
          "jar=target/HyAuth-Agent-$tag.jar" >> $env:GITHUB_OUTPUT
          "SHA256  $hash" | Add-Content -Path BUILD.txt
          "（$tag 由 GitHub Actions 构建）" | Add-Content -Path BUILD.txt

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: HyAuth-Agent ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          body: |
            **下载**：`HyAuth-Agent-1.0.0.jar`（与部署文档、start.sh/start.bat 里的文件名一致，直接替换服务端目录里的旧 jar 即可）
            以及同字节的归档副本 `HyAuth-Agent-${{ steps.meta.outputs.tag }}.jar`。

            构建信息
            - 大小：${{ steps.meta.outputs.size }} 字节
            - SHA256：`${{ steps.meta.outputs.sha256 }}`
            - 编译：JDK 21 + Maven（`--release 8`），已通过 `verify\loaderiso.ps1` / `verify\chat.ps1` / `verify\verify.ps1` 三套自检

            升级：替换 jar → 重启服务端。配置项说明见仓库 README。
          files: |
            target/HyAuth-Agent-1.0.0.jar
            ${{ steps.meta.outputs.jar }}
            BUILD.txt
          fail_on_unmatched_files: true
